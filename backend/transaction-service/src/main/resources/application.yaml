spring:
  application:
    name: transaction-service

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true}
    username: ${TRANSACTION_DB_USERNAME:root}
    password: ${TRANSACTION_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

account:
  service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health, info

gateway:
  auth:
    token: ${GATEWAY_AUTH_TOKEN:transmoney-local-dev-gateway-auth-token-2026}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:transmoney-local-dev-internal-service-token-2026}
