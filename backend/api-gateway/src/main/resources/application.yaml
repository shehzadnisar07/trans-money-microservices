spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Auth Service
            - id: auth-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/auth/**

            # Account Service
            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@keyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # Transaction Service
            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@keyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

jwt:
  secret: ${JWT_SECRET}

gateway:
  auth:
    token: ${GATEWAY_AUTH_TOKEN:transmoney-local-dev-gateway-auth-token-2026}
